<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academics · Kummitha Abhiram Reddy</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#09090e; --surface:#111118; --ink:#e8e6f0; --muted:#6a6878;
  --dim:#2e2c3a; --a1:#c8f135; --a2:#7b61ff; --a3:#ff5e3a; --a4:#00d4aa; --a5:#f5a623;
  --acad-light:#cdd8ff; --acad-light-dim:#8f9ac7;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;font-size:16px;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
::selection{background:var(--a1);color:#09090e;}

/* ===== Academics page styles (moved out of index.html) ===== */
/* ===== Academics overlay — compact style with smooth transitions ===== */
.acad-shell{width:100%;max-width:640px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;}
.acad-topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:14px 18px;background:rgba(9,9,14,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--dim);}
.nav-logo-link{position:relative;width:30px;height:30px;border-radius:50%;overflow:hidden;border:2px solid var(--dim);flex-shrink:0;display:block;transition:border-color .2s;}
.nav-logo-link:hover{border-color:var(--a1);}
.nav-logo-img{width:100%;height:100%;object-fit:cover;display:block;}
.acad-back{background:none;border:1px solid var(--dim);color:var(--ink);width:28px;height:28px;border-radius:50%;font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s,transform .2s;}
.acad-back:hover{border-color:var(--a1);color:var(--a1);transform:translateX(-2px);}
.acad-title{font-family:'Instrument Serif',serif;font-size:16px;color:var(--ink);flex:1;transition:opacity .2s ease;}
.acad-close{background:none;border:none;color:var(--muted);font-size:19px;cursor:pointer;width:28px;height:28px;transition:color .2s,transform .2s;}
.page-home-btn{display:flex;align-items:center;justify-content:center;text-decoration:none;}
.acad-close:hover{color:var(--a3);transform:rotate(90deg);}
.acad-body{padding:16px 14px 44px;transition:opacity .28s ease, transform .28s ease;will-change:opacity,transform;}

.acad-countdown{background:var(--surface);border:1px solid rgba(205,216,255,.18);border-radius:12px;padding:14px 14px;margin-bottom:18px;text-align:center;}
.acad-cd-label{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acad-light-dim);margin-bottom:10px;}
.acad-cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.acad-cd-unit{background:var(--bg);border:1px solid rgba(205,216,255,.1);border-radius:7px;padding:8px 3px;transition:transform .15s ease,border-color .15s ease;}
.acad-cd-unit:hover{border-color:rgba(205,216,255,.4);}
.acad-cd-num{font-family:'DM Mono',monospace;font-size:17px;font-weight:500;color:var(--acad-light);}
.acad-cd-unitlabel{font-size:8px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-top:2px;}
.acad-cd-sub{font-size:9.5px;color:var(--muted);margin-top:10px;}

.acad-list{display:flex;flex-direction:column;gap:8px;}
.acad-item{background:var(--surface);border:1px solid var(--dim);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .2s,transform .2s,background .2s;}
.acad-item:hover{border-color:var(--a1);transform:translateX(3px);}
.acad-item:active{transform:translateX(1px) scale(.99);}
.acad-item.locked{opacity:.4;cursor:not-allowed;}
.acad-item.locked:hover{border-color:var(--dim);transform:none;}
.acad-item-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);flex-shrink:0;width:20px;}
.acad-item-main{flex:1;min-width:0;}
.acad-item-name{font-family:'Instrument Serif',serif;font-size:15px;color:var(--ink);}
.acad-item-sub{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:.4px;}
.acad-item-badge{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.8px;text-transform:uppercase;padding:3px 7px;border-radius:20px;background:rgba(200,241,53,.12);color:var(--a1);white-space:nowrap;flex-shrink:0;}
.acad-item-badge.pending{background:rgba(245,166,35,.12);color:var(--a5);}
.acad-item-badge.locked{background:rgba(106,104,120,.15);color:var(--muted);}

.acad-stats-row{display:flex;gap:8px;margin-bottom:16px;}
.acad-stat{flex:1;background:var(--surface);border:1px solid var(--dim);border-radius:9px;padding:10px 8px;text-align:center;transition:border-color .2s;}
.acad-stat:hover{border-color:var(--a1);}
.acad-stat-val{font-family:'DM Mono',monospace;font-size:15px;color:var(--acad-light);}
.acad-stat-label{font-size:8px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-top:3px;}

.acad-hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px;}
.acad-hub-card{background:var(--surface);border:1px solid var(--dim);border-radius:8px;padding:8px 8px;cursor:pointer;transition:border-color .2s,transform .2s;display:flex;align-items:center;gap:7px;position:relative;}
.acad-hub-card:hover{border-color:var(--a1);transform:translateY(-1px);}
.acad-hub-card:active{transform:translateY(0) scale(.98);}
.acad-hub-num{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);flex-shrink:0;}
.acad-hub-icon{font-size:13px;margin-bottom:0;flex-shrink:0;}
.acad-hub-text{min-width:0;}
.acad-hub-name{font-size:10.5px;font-weight:500;color:var(--ink);line-height:1.2;}
.acad-hub-note{font-family:'DM Mono',monospace;font-size:7px;color:var(--muted);margin-top:2px;}

/* Official-document replica (hall ticket / result sheet) — rendered
   as a clean printed-sheet card, never a photo of the paper */
.doc-sheet{background:#fff;color:#1a1a1a;border-radius:6px;padding:16px 14px;font-family:'DM Sans',Arial,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35);}
.doc-head{text-align:center;margin-bottom:12px;}
.doc-head h4{font-size:12px;font-weight:700;letter-spacing:.2px;margin-bottom:2px;line-height:1.35;}
.doc-head .doc-sub{font-size:9.5px;color:#555;}
.doc-divider{border:none;border-top:1px solid #ddd;margin:10px 0;}
.doc-row{display:flex;font-size:10.5px;margin-bottom:5px;}
.doc-row .doc-k{width:98px;color:#555;flex-shrink:0;}
.doc-row .doc-v{color:#111;font-weight:600;}
.doc-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:9.5px;}
.doc-table th{background:#2b3245;color:#fff;padding:5px 5px;text-align:left;font-size:8px;letter-spacing:.3px;text-transform:uppercase;}
.doc-table td{padding:5px 5px;border-bottom:1px solid #eee;color:#222;}
.doc-table tr:last-child td{border-bottom:none;}
.doc-pass{color:#1c6b46;font-weight:700;}
.doc-photo-box{width:56px;height:68px;border:1px solid #ccc;float:right;background:#eee;display:flex;align-items:center;justify-content:center;font-size:8px;color:#999;text-align:center;margin-left:8px;}
.doc-cert-image{width:100%;height:auto;display:block;border-radius:6px;margin-bottom:12px;border:1px solid #ddd;}
.doc-summary-row{display:flex;justify-content:space-between;background:#f4f4f4;border-radius:6px;padding:8px 10px;margin-top:12px;font-size:10px;}
.doc-summary-item{text-align:center;flex:1;}
.doc-summary-item b{display:block;font-size:13px;color:#1c6b46;}
.doc-pending{text-align:center;padding:34px 8px;color:#888;font-size:11.5px;line-height:1.65;}
.doc-footer-note{text-align:center;font-size:8px;color:#888;margin-top:12px;}
.doc-sign-row{display:flex;justify-content:space-between;gap:14px;margin-top:26px;}
.doc-sign-col{flex:1;text-align:center;}
.doc-sign-mark{font-family:'Instrument Serif',serif;font-style:italic;font-size:13px;color:#222;border-bottom:1px solid #999;padding-bottom:4px;margin-bottom:4px;min-height:16px;}
.doc-sign-label{font-size:8px;color:#555;line-height:1.5;}
.doc-instr-title{font-weight:700;font-size:10px;text-decoration:underline;text-align:center;margin:20px 0 8px;color:#111;}
.doc-instr-list{font-size:8.3px;color:#333;line-height:1.6;margin:0;padding-left:15px;}
.doc-instr-list li{margin-bottom:5px;}
.acad-hint{margin-top:12px;text-align:center;font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);}

/* ===== Notes (per-subject documents, pulled from hall ticket subjects) ===== */
.notes-subject{background:var(--surface);border:1px solid var(--dim);border-radius:9px;padding:11px 13px;margin-bottom:8px;}
.notes-subject-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.notes-subject-code{font-family:'DM Mono',monospace;font-size:8.5px;color:var(--muted);letter-spacing:.5px;}
.notes-subject-name{font-size:12.5px;font-weight:500;color:var(--ink);margin-top:2px;line-height:1.35;}
.notes-subject-badge{font-family:'DM Mono',monospace;font-size:7.5px;letter-spacing:.5px;text-transform:uppercase;padding:3px 7px;border-radius:20px;background:rgba(200,241,53,.12);color:var(--a1);white-space:nowrap;flex-shrink:0;}
.notes-subject-badge.empty{background:rgba(106,104,120,.15);color:var(--muted);}
.notes-file-list{margin-top:9px;display:flex;flex-direction:column;gap:6px;}
.notes-file-row{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--dim);border-radius:7px;padding:8px 10px;text-decoration:none;transition:border-color .2s,transform .2s;}
.notes-file-row:hover{border-color:var(--a1);transform:translateX(2px);}
.notes-file-icon{font-size:13px;flex-shrink:0;}
.notes-file-title{font-size:11px;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.notes-file-hint{font-family:'DM Mono',monospace;font-size:7.5px;color:var(--muted);flex-shrink:0;}
.notes-empty-hint{margin-top:8px;font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);}
.notes-subject-click{cursor:pointer;transition:border-color .2s,transform .2s;}
.notes-subject-click:hover{border-color:var(--a1);transform:translateX(2px);}
.notes-open-hint{margin-top:9px;font-family:'DM Mono',monospace;font-size:8.5px;color:var(--muted);letter-spacing:.3px;}

/* ===== Units page (5 fixed units per subject) & unit note page ===== */
.notes-subject-banner{background:var(--surface);border:1px solid var(--dim);border-radius:9px;padding:12px 14px;margin-bottom:14px;}
.notes-subject-banner .notes-subject-code{margin-bottom:2px;}
.unit-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--dim);border-radius:8px;padding:11px 13px;margin-bottom:7px;cursor:pointer;transition:border-color .2s,transform .2s;}
.unit-row:hover{border-color:var(--a1);transform:translateX(2px);}
.unit-row-left{display:flex;flex-direction:column;gap:2px;}
.unit-row-num{font-size:12px;font-weight:600;color:var(--ink);}
.unit-row-status{font-family:'DM Mono',monospace;font-size:8.5px;color:var(--a1);letter-spacing:.3px;}
.unit-row.empty .unit-row-status{color:var(--muted);}
.unit-row-arrow{font-size:16px;color:var(--muted);flex-shrink:0;}

/* ===== Unit syllabus block (text table, replaces any syllabus image) ===== */
.syllabus-box{background:var(--surface);border:1px solid var(--dim);border-radius:9px;padding:12px 14px;margin-top:12px;}
.syllabus-box-title{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:9px;}
table.syllabus-table{width:100%;border-collapse:collapse;font-size:10.5px;}
.syllabus-table td{padding:7px 4px;border-bottom:1px solid var(--dim);color:var(--ink);vertical-align:top;line-height:1.6;}
.syllabus-table tr:last-child td{border-bottom:none;}
.syllabus-table td.syl-label{width:56px;color:var(--a1);font-weight:600;white-space:nowrap;font-size:9.5px;}

/* Rounded pill "link card" — matches the reference screenshot: dark card,
   blue link icon, salmon URL text, salmon external-arrow. */
.wps-link-card{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid rgba(255,94,58,.35);border-radius:999px;padding:13px 18px;text-decoration:none;transition:border-color .2s,background .2s;}
.wps-link-card:hover{border-color:var(--a3);background:#151016;}
.wps-link-icon{font-size:14px;color:#5b8def;flex-shrink:0;transform:rotate(-45deg);display:inline-block;}
.wps-link-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'DM Mono',monospace;font-size:11.5px;color:var(--a3);letter-spacing:.2px;}
.wps-link-arrow{font-size:13px;color:var(--a3);flex-shrink:0;}


</style>
</head>

<script>
/* ================= ACADEMICS MODULE ================= */
const ACAD_JOIN_DATE = new Date('2025-09-18T00:00:00');
const ACAD_END_DATE   = new Date('2029-09-18T00:00:00'); // join + 4 years
const ACAD_MONTHS_PER_YEAR = 10; // each academic year runs ~10 active/instructional months, not 12 — the remaining ~2 months are vacation/break, so year-to-year planning below is based on 10-month cycles rather than flat calendar years

// Plans the active instructional window for a given academic year (by index or by year id)
// using 10 active months per year instead of assuming all 12 months are in-session.
// If a year has a real, confirmed startDate (e.g. once it's known/announced), that is used
// directly; otherwise the window is estimated by chaining 12-month steps off the nearest
// earlier year that does have a confirmed startDate (or the original join date as a fallback).
function acadYearWindow(yearIdOrIndex){
  let index, y;
  if(typeof yearIdOrIndex === 'string'){
    y = acadFindYear(yearIdOrIndex);
    index = ACADEMICS_DATA.years.indexOf(y);
  } else {
    index = yearIdOrIndex;
    y = ACADEMICS_DATA.years[index];
  }
  let start;
  if(y && y.startDate){
    start = new Date(y.startDate);
  } else {
    let anchorIndex = 0, anchorDate = new Date(ACAD_JOIN_DATE);
    for(let i=index-1;i>=0;i--){
      if(ACADEMICS_DATA.years[i].startDate){ anchorDate = new Date(ACADEMICS_DATA.years[i].startDate); anchorIndex = i; break; }
    }
    start = new Date(anchorDate);
    start.setMonth(start.getMonth() + (index - anchorIndex) * 12);
  }
  const end = new Date(start);
  end.setMonth(end.getMonth() + ACAD_MONTHS_PER_YEAR);
  return { start, end };
}
function acadFormatMonthYear(d){
  return d.toLocaleDateString('en-GB', { month:'short', year:'numeric' });
}
// Roman numeral for the academic year, used on hall tickets / result sheets
function acadYearRoman(yearId){
  return { y1:'I', y2:'II', y3:'III', y4:'IV' }[yearId] || 'I';
}
// Regulation in force for every year — R23 across the board
function acadRegulation(yearId){
  const y = acadFindYear(yearId);
  return (y && y.regulation) || 'R23';
}

// Works out a semester's live status from today's date + its resultsReleased flag,
// so the badge updates on its own as time passes instead of staying stuck on "Ongoing"
// until someone manually edits the data. Once results are actually entered, resultsReleased
// simply takes over and shows "Result Out".
function acadSemStatus(s){
  if(s.resultsReleased) return { label:'Result Out', pending:false };
  const now = new Date();
  const start = new Date(s.start);
  const end = new Date(s.end);
  if(!isNaN(end) && now > end)   return { label:'Completed · Result Awaited', pending:true };
  if(!isNaN(start) && now < start) return { label:'Upcoming', pending:true };
  return { label:'Ongoing', pending:true };
}

const ACADEMICS_DATA = {
  years: [

// Escapes text pulled into template strings as HTML (subject names, links,
// certificate details, etc.) so special characters render safely instead of
// breaking markup. Used throughout the results/notes/certificate/project views.
function escapeHtml(str){
  if(str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

const acadState = { stack:[{view:'years'}] };

function acadFindYear(id){ return ACADEMICS_DATA.years.find(y=>y.id===id); }
function acadFindSem(yearId, semId){ const y=acadFindYear(yearId); return (y && y.semesters) ? y.semesters.find(s=>s.id===semId) : null; }
function acadPush(view, params){ acadState.stack.push(Object.assign({view}, params||{})); acadRender('forward'); }
function acadPop(){ if(acadState.stack.length>1){ acadState.stack.pop(); acadRender('back'); } }
function acadReset(){ acadState.stack=[{view:'years'}]; acadRender('none'); }

function acadUpdateCountdown(){
  const box = document.getElementById('acadCountdownBox');
  if(!box) return;
  let diff = ACAD_END_DATE - new Date();
  if(diff < 0) diff = 0;
  const days  = Math.floor(diff/86400000);
  const hours = Math.floor((diff/3600000)%24);
  const mins  = Math.floor((diff/60000)%60);
  const secs  = Math.floor((diff/1000)%60);
  const set=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent=v;};
  set('cdDays', days);
  set('cdHours', String(hours).padStart(2,'0'));
  set('cdMins', String(mins).padStart(2,'0'));
  set('cdSecs', String(secs).padStart(2,'0'));
}
setInterval(acadUpdateCountdown, 1000);

function acadRenderYears(){
  let html = acadCountdownHTML() + `<div class="acad-list">`;
  ACADEMICS_DATA.years.forEach((y,index)=>{
    const locked = y.status==='locked';
    let sub;
    if(locked){
      const win = acadYearWindow(index);
      if(y.startDate){
        const weekday = win.start.toLocaleDateString('en-GB',{weekday:'long'});
        sub = `Starts ${weekday}, ${acadFormatMonthYear(win.start)} – ${acadFormatMonthYear(win.end)} · 10-month academic year (${y.regulation||'R23'})`;
      } else {
        sub = `Planned ${acadFormatMonthYear(win.start)} – ${acadFormatMonthYear(win.end)} · 10-month academic year (${y.regulation||'R23'})`;
      }
    } else {
      sub = `B.Tech · Information Technology · 10-month academic year (${y.regulation||'R23'})`;
    }
    html += `<div class="acad-item ${locked?'locked':''}" ${locked?'':`onclick="acadPush('semesters',{yearId:'${y.id}'})"`}>
      <span class="acad-item-num">${String(index+1).padStart(2,'0')}</span>
      <div class="acad-item-main">
        <div class="acad-item-name">${y.label}</div>

      </div>
      <span class="acad-item-badge ${locked?'locked':''}">${locked?'Locked':'View'}</span>
    </div>`;
  });
  return html + `</div>`;
}

    html += `<div class="acad-item"
      onclick="acadPush('hub',{yearId:'${y.id}',semId:'${s.id}'})"

      <div class="acad-item-main">

  return html;
}

// One-line status shown on the Notes hub card: how many note files exist
// across this semester's subjects (using the hall-ticket-derived subject list),
// or a pending message when the subject list itself isn't published yet.
function acadNotesSummary(s){
  if(!s.subjects || !s.subjects.length) return 'Pending subject list';
  const total = s.subjects.reduce((sum,sub)=>sum+((sub.units||[]).filter(u=>u&&u.file).length),0);
  if(!total) return 'No notes yet';
  return total + (total===1 ? ' unit uploaded' : ' units uploaded');
}

// Opens the official result link when it's a real, directly-loadable URL. The raw
// javascript:__doPostBack(...) snippet copied from an ASP.NET results portal only works
// inside that portal's own page (it needs that page's postback machinery), so it can't
// navigate anywhere from here — in that case we explain that clearly instead of failing silently.
function acadOpenOfficialResult(el){
  const link = el.getAttribute('data-link') || '';
  const regdNo = el.getAttribute('data-regdno') || '';
  if(/^https?:\/\//i.test(link)){
    window.open(link, '_blank', 'noopener');
    return;
  }
  alert("This button mirrors a control from SRKR's own online results portal, so it only works when clicked directly on that site — it can't run stand-alone here.\n\nTo view the verified result, open the official SRKR examinations portal and search using Register No: " + regdNo);
}

// Notes screen: one card per subject (subjects come from the same hall-ticket-
// derived list used by Results/Hall Ticket). Tapping a subject opens a new page
// listing its 5 units (every subject follows a 5-unit syllabus); tapping an
// uploaded unit opens a new page with the note link, shown as a link card.
// Fully data-driven — a future year just needs a real `subjects` array (each
// with a 5-slot `units` array) and all three screens work with no edits here.
function acadRenderNotes(yearId, semId){
  const s = acadFindSem(yearId, semId);
  if(!s) return '';
  if(!s.subjects || !s.subjects.length){
    return `<div class="doc-sheet"><div class="doc-pending">📝 Subjects for ${escapeHtml(s.label)} haven't been published yet.<br><br>Once the subject list is available (from the hall ticket or results), notes can be attached here per subject.</div></div>`;
  }
  return s.subjects.map(sub=>{
    const units = sub.units || [];
    const uploaded = units.filter(u=>u&&u.file).length;
    return `<div class="notes-subject notes-subject-click" onclick="acadPush('units',{yearId:'${yearId}',semId:'${semId}',subCode:'${escapeHtml(sub.code)}'})">
      <div class="notes-subject-head">
        <div>
          <div class="notes-subject-code">${escapeHtml(sub.code)}</div>
          <div class="notes-subject-name">${escapeHtml(sub.name)}</div>
        </div>
        <span class="notes-subject-badge ${uploaded?'':'empty'}">${uploaded}/5 units</span>
      </div>
      <div class="notes-open-hint">5 units · tap to open ›</div>
    </div>`;
  }).join('');
}

// Units screen: 5 fixed unit slots for a single subject. Tapping a unit opens
// its note page (the link card) or, if nothing's uploaded yet, an empty state.
function acadRenderUnits(yearId, semId, subCode){
  const s = acadFindSem(yearId, semId);
  const sub = s && s.subjects ? s.subjects.find(x=>x.code===subCode) : null;
  if(!sub) return '';
  const units = sub.units || [null,null,null,null,null];
  let html = `<div class="notes-subject-banner">
    <div class="notes-subject-code">${escapeHtml(sub.code)}</div>
    <div class="notes-subject-name">${escapeHtml(sub.name)}</div>
  </div>`;
  html += units.map((u,i)=>`
    <div class="unit-row ${u&&u.file?'':'empty'}" onclick="acadPush('unitNote',{yearId:'${yearId}',semId:'${semId}',subCode:'${escapeHtml(subCode)}',unitIdx:${i}})">
      <div class="unit-row-left">
        <span class="unit-row-num">Unit ${i+1}${u&&(u.name||(u.syllabus&&u.syllabus.topic))?' · '+escapeHtml(u.name||u.syllabus.topic):''}</span>
        <span class="unit-row-status">${u&&u.file ? 'Notes available' : 'Not uploaded yet'}</span>
      </div>
      <span class="unit-row-arrow">›</span>
    </div>`).join('');
  return html;
}

// Unit note screen: shows the uploaded note as a single rounded link card
// (🔗 + URL + ↗), or an empty state if this unit has nothing uploaded yet.
function acadRenderUnitNote(yearId, semId, subCode, unitIdx){
  const s = acadFindSem(yearId, semId);
  const sub = s && s.subjects ? s.subjects.find(x=>x.code===subCode) : null;
  if(!sub) return '';
  const unit = (sub.units || [])[unitIdx];
  let html = `<div class="notes-subject-banner">
    <div class="notes-subject-code">${escapeHtml(sub.code)} · Unit ${unitIdx+1}</div>
    <div class="notes-subject-name">${unit&&unit.name ? escapeHtml(unit.name) : escapeHtml(sub.name)}</div>
  </div>`;
  html += unit && unit.file
    ? `<a class="wps-link-card" href="${escapeHtml(unit.file)}" target="_blank" rel="noopener">
         <span class="wps-link-icon">🔗</span>
         <span class="wps-link-text">${escapeHtml(unit.file)}</span>
         <span class="wps-link-arrow">↗</span>
       </a>`
    : `<div class="notes-empty-hint">No notes uploaded yet for Unit ${unitIdx+1}.</div>`;
  if(unit && unit.syllabus){
    const syl = unit.syllabus;
    html += `<div class="syllabus-box">
      <div class="syllabus-box-title">Syllabus</div>
      <table class="syllabus-table">
        <tr><td class="syl-label">Topic</td><td>${escapeHtml(syl.topic)}</td></tr>
        <tr><td class="syl-label">Hours</td><td>${escapeHtml(syl.hours)}</td></tr>
        <tr><td class="syl-label">Content</td><td>${escapeHtml(syl.content)}</td></tr>
      </table>
    </div>`;
  }
  return html;
}

// Smooth crossfade + slide transition between academics views.
// direction: 'forward' (push, slides in from the right),
//            'back' (pop, slides in from the left),
//            'none' (first paint, no animation).
function acadRender(direction){
  direction = direction || 'forward';
  const top = acadState.stack[acadState.stack.length-1];
  const backBtn = document.getElementById('acadBackBtn');
  const titleEl = document.getElementById('acadTitle');
  const body = document.getElementById('acadBody');
  if(!backBtn || !titleEl || !body) return;
  backBtn.style.display = acadState.stack.length>1 ? 'flex' : 'none';

  function paint(){
    // Wrapped in try/catch so that if any single view throws (a data-shape
    // surprise, a missing field, etc.) we fall back to a visible error card
    // instead of leaving the page faded to opacity:0 — i.e. a "black screen"
    // that never gets un-hidden because the crash happened before the code
    // that restores opacity/transform ever ran.
    let title = 'Academics', html = '';
    try{
      switch(top.view){
        case 'years':      title='Academics';                              html=acadRenderYears(); break;
        case 'semesters':  title=acadFindYear(top.yearId).label;           html=acadRenderSemesters(top.yearId); break;
        case 'hub':        title=acadFindSem(top.yearId, top.semId).label; html=acadRenderHub(top.yearId, top.semId); break;
        case 'hallticket': title='Hall Ticket';                            html=acadRenderHallTicket(top.yearId, top.semId); break;
        case 'results':    title='Results';                                html=acadRenderResults(top.yearId, top.semId); break;
        case 'notes':      title='Notes';                                  html=acadRenderNotes(top.yearId, top.semId); break;
        case 'units':       title=(()=>{const s=acadFindSem(top.yearId,top.semId);const sub=s&&s.subjects?s.subjects.find(x=>x.code===top.subCode):null;return sub?sub.name:'Units';})(); html=acadRenderUnits(top.yearId, top.semId, top.subCode); break;
        case 'unitNote':    title='Unit '+(top.unitIdx+1)+' Notes';        html=acadRenderUnitNote(top.yearId, top.semId, top.subCode, top.unitIdx); break;
        case 'certificate':title='Certificate';                            html=acadRenderCertificate(top.yearId, top.semId); break;
        case 'semproject': title='Project';                                html=acadRenderSemProject(top.yearId, top.semId); break;
      }
    } catch(err){
      console.error('acadRender: view "'+top.view+'" failed to render:', err);
      title = 'Something went wrong';
      html = `<div class="doc-sheet"><div class="doc-pending">⚠️ This page hit an unexpected error and couldn't load.<br><br>Try going back and opening it again.</div></div>`;
    }
    titleEl.textContent = title;
    body.innerHTML = html;
    acadUpdateCountdown();
  }

  if(direction === 'none'){
    body.style.transition = 'none';
    body.style.opacity = '1';
    body.style.transform = 'translateX(0)';
    paint();
    requestAnimationFrame(()=>{ body.style.transition = ''; });
    return;
  }

  const outX = direction === 'forward' ? '-10px' : '10px';
  const inX  = direction === 'forward' ? '10px' : '-10px';

  body.style.transition = 'opacity .16s ease, transform .16s ease';
  body.style.opacity = '0';
  body.style.transform = `translateX(${outX})`;

  setTimeout(()=>{
    paint();
    body.style.transition = 'none';
    body.style.transform = `translateX(${inX})`;
    requestAnimationFrame(()=>{
      body.style.transition = 'opacity .22s ease, transform .22s ease';
      body.style.opacity = '1';
      body.style.transform = 'translateX(0)';
    });
  }, 160);
}


// Standalone page: back button navigates within the academics module,
// the × (acadCloseBtn) is a plain link back to index.html, and Escape
// also returns to the main site instead of closing an in-page overlay.
document.getElementById('acadBackBtn').addEventListener('click', acadPop);
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') window.location.href = 'index.html'; });
acadReset();
</script>
