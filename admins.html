<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panels · Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#09090e; --surface:#111118; --card-bg:#1a191f; --ink:#e8e6f0; --muted:#6a6878;
  --dim:#2e2c3a; --a1:#4da3ff; --a2:#7b61ff; --a3:#ff5e3a; --a4:#00d4aa; --a5:#f5a623;
  --spacing-xs: 4px; --spacing-sm: 8px; --spacing-md: 16px; --spacing-lg: 24px; --spacing-xl: 32px;
  --radius-sm: 6px; --radius-md: 12px; --radius-lg: 16px;
  --transition-fast: 0.2s; --transition-normal: 0.3s; --transition-slow: 0.5s;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;font-size:16px;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
::selection{background:var(--a1);color:#09090e;}

/* ===== HEADER & NAVIGATION ===== */
.header{position:sticky;top:0;z-index:10;background:rgba(9,9,14,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--dim);padding:var(--spacing-md) var(--spacing-lg);}
.header-container{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-lg);}
.header-logo{width:36px;height:36px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:transform var(--transition-fast);outline:none;-webkit-tap-highlight-color:transparent;}.header-logo:focus,.header-logo:active,.header-logo:visited{outline:none;}.header-logo img{width:100%;height:100%;object-fit:cover;display:block;}
.header-logo:hover{transform:scale(1.08);}

.header-title{flex:1;}
.header-title h1{font-family:'Instrument Serif',serif;font-size:20px;color:var(--ink);}
.header-title p{font-size:11px;color:var(--muted);margin-top:2px;}

.header-stats{display:flex;gap:var(--spacing-lg);align-items:center;}
.stat-item{text-align:center;}
.stat-number{font-size:18px;font-weight:600;color:var(--a1);}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}

.header-nav{display:flex;gap:var(--spacing-md);}
.nav-btn{background:none;border:1px solid var(--dim);color:var(--ink);width:32px;height:32px;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition-fast);font-size:14px;}
.nav-btn:hover{border-color:var(--a1);color:var(--a1);background:rgba(77,163,255,.08);}

/* ===== MAIN LAYOUT ===== */
.container{max-width:1200px;margin:0 auto;padding:var(--spacing-xl) var(--spacing-lg);}

.controls-section{margin-bottom:var(--spacing-xl);}
.controls-wrapper{display:flex;gap:var(--spacing-md);flex-wrap:wrap;align-items:center;}

/* Search Bar */
.search-box{flex:1;min-width:200px;position:relative;}
.search-box input{width:100%;padding:var(--spacing-sm) var(--spacing-md);background:var(--surface);border:1px solid var(--dim);border-radius:var(--radius-md);color:var(--ink);font-size:13px;font-family:'DM Sans',sans-serif;transition:all var(--transition-fast);}
.search-box input:focus{outline:none;border-color:var(--a1);background:rgba(77,163,255,.05);}
.search-box input::placeholder{color:var(--muted);}
.search-icon{position:absolute;right:var(--spacing-md);top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}

/* Filter Buttons */
.filter-group{display:flex;gap:var(--spacing-sm);flex-wrap:wrap;}
.filter-btn{padding:var(--spacing-sm) var(--spacing-md);background:var(--surface);border:1px solid var(--dim);border-radius:var(--radius-md);color:var(--muted);font-size:11px;cursor:pointer;transition:all var(--transition-fast);text-transform:uppercase;letter-spacing:.5px;font-weight:500;}
.filter-btn:hover{border-color:var(--a1);color:var(--a1);}
.filter-btn.active{background:var(--a1);color:#000;border-color:var(--a1);}

/* ===== DASHBOARD GRID ===== */
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:var(--spacing-lg);margin-bottom:var(--spacing-xl);}

/* Card Container — 3D flip */
.flip-card{cursor:pointer;perspective:1800px;}
.flip-card-inner{position:relative;width:100%;display:grid;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.65,0,.35,1);}
.flip-card:hover .flip-card-inner{transform:rotateY(6deg);}
.flip-card.flipped:hover .flip-card-inner{transform:rotateY(174deg);}
.flip-card.flipped .flip-card-inner{transform:rotateY(180deg);}
.flip-card:hover{filter:drop-shadow(0 12px 28px rgba(0,0,0,.45));}

.flip-card-front, .flip-card-back{grid-area:1/1;width:100%;min-height:400px;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.flip-card-back{transform:rotateY(180deg);}

/* Front of Card */
.flip-card-front{background:linear-gradient(150deg,var(--card-bg) 0%,#151319 60%,rgba(26,25,31,.9) 100%);border:1px solid var(--dim);border-radius:var(--radius-lg);padding:var(--spacing-lg);overflow:hidden;position:relative;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 20px rgba(0,0,0,.25);transition:border-color var(--transition-normal);}
.flip-card:hover .flip-card-front{border-color:rgba(77,163,255,.35);}
.flip-card-front::before{content:'';position:absolute;top:-60%;right:-40%;width:220px;height:220px;background:radial-gradient(circle,var(--a1),transparent 70%);opacity:0.08;border-radius:50%;pointer-events:none;}
.flip-card-front::after{content:'';position:absolute;inset:0;border-radius:var(--radius-lg);padding:1px;background:linear-gradient(135deg,rgba(77,163,255,.25),transparent 40%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.6;}

.card-header{position:relative;z-index:1;margin-bottom:auto;}
.card-category{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--a1);font-weight:600;margin-bottom:var(--spacing-xs);}
.card-title{font-family:'Instrument Serif',serif;font-size:22px;color:var(--ink);line-height:1.3;margin-bottom:var(--spacing-md);}

.card-footer{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;margin-top:var(--spacing-lg);padding-top:var(--spacing-md);border-top:1px solid var(--dim);}
.card-stats-mini{display:flex;gap:var(--spacing-md);}
.stat-mini{text-align:center;}
.stat-mini-val{font-size:14px;font-weight:600;color:var(--a1);}
.stat-mini-label{font-size:9px;color:var(--muted);}
.card-hint{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:4px;transition:color var(--transition-fast),transform var(--transition-fast);}
.flip-card:hover .card-hint{color:var(--a1);transform:translateX(2px);}

/* Back of Card — dark theme */
.flip-card-back{background:linear-gradient(155deg,#151420 0%,#0c0b12 100%);padding:var(--spacing-lg);justify-content:space-between;border-radius:var(--radius-lg);position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.55);border:1px solid rgba(77,163,255,.25);}
.flip-card-back::before{content:'';position:absolute;bottom:-30%;left:-20%;width:220px;height:220px;background:radial-gradient(circle,rgba(77,163,255,.16),transparent 70%);pointer-events:none;}
.flip-card-back::after{content:'';position:absolute;top:-40%;right:-30%;width:200px;height:200px;background:radial-gradient(circle,rgba(123,97,255,.14),transparent 70%);pointer-events:none;}
.back-content{color:var(--ink);position:relative;z-index:1;}
.back-title{font-family:'Instrument Serif',serif;font-size:18px;margin-bottom:var(--spacing-sm);line-height:1.3;color:var(--ink);}
.back-details{font-size:12px;line-height:1.6;color:var(--muted);margin-bottom:var(--spacing-md);}
.back-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--spacing-md);}
.back-tag{font-size:9px;padding:3px 8px;background:rgba(77,163,255,.1);border:1px solid rgba(77,163,255,.3);border-radius:999px;color:var(--a1);text-transform:uppercase;letter-spacing:.3px;}
.back-action{display:inline-block;padding:var(--spacing-sm) var(--spacing-md);background:rgba(77,163,255,.12);border:1px solid rgba(77,163,255,.4);border-radius:var(--radius-sm);color:var(--a1);text-decoration:none;font-size:11px;font-weight:600;cursor:pointer;transition:all var(--transition-fast);position:relative;z-index:1;text-align:center;flex-shrink:0;}
.back-action:hover{background:var(--a1);color:#000;border-color:var(--a1);}

/* Full-info back face (shown on click) */
.flip-card-back.full-info{padding:var(--spacing-md) var(--spacing-md) var(--spacing-sm);gap:var(--spacing-sm);}
.back-content-full{color:var(--ink);position:relative;z-index:1;overflow:visible;padding-right:2px;cursor:default;}

.back-section-label{font-size:9px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;color:var(--a1);opacity:.85;margin:var(--spacing-sm) 0 6px;}
.back-stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.back-stat{background:rgba(255,255,255,.04);border:1px solid var(--dim);border-radius:8px;padding:6px 8px;}
.back-stat-val{font-size:14px;font-weight:700;line-height:1.2;color:var(--ink);}
.back-stat-label{font-size:8px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-top:1px;}
.back-details-list{list-style:none;display:flex;flex-direction:column;gap:5px;}
.back-details-list li{font-size:11px;line-height:1.45;color:var(--muted);padding-left:12px;position:relative;}
.back-details-list li::before{content:'';position:absolute;left:0;top:6px;width:5px;height:5px;border-radius:50%;background:var(--a1);}
.back-team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.back-team-card{position:relative;background:rgba(255,255,255,.03);border:1px solid var(--dim);border-radius:var(--radius-md);padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-align:center;transition:border-color var(--transition-fast),background var(--transition-fast);min-height:76px;}
.back-team-card:hover{border-color:rgba(77,163,255,.4);background:rgba(77,163,255,.06);}
.back-team-avatar{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;background:rgba(77,163,255,.2);color:var(--a1);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;}
.back-team-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.back-team-caption{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.back-team-card.revealed .back-team-caption{display:none;}
.back-team-reveal{display:none;flex-direction:column;align-items:center;gap:2px;}
.back-team-card.revealed .back-team-reveal{display:flex;}
.back-team-name{font-size:10px;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;line-height:1.2;}
.back-team-role{font-size:8px;color:var(--muted);}

/* ===== MODAL ===== */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;animation:fadeIn var(--transition-normal);}
.modal.active{display:flex;}
.modal-content{background:var(--surface);border-radius:var(--radius-lg);width:90%;max-width:600px;max-height:85vh;overflow-y:auto;padding:var(--spacing-xl);border:1px solid var(--dim);animation:slideIn var(--transition-slow);}

.modal-header{margin-bottom:var(--spacing-xl);border-bottom:1px solid var(--dim);padding-bottom:var(--spacing-lg);}
.modal-title{font-family:'Instrument Serif',serif;font-size:28px;color:var(--ink);margin-bottom:var(--spacing-sm);}

.modal-section{margin-bottom:var(--spacing-xl);}
.modal-section-title{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--a1);margin-bottom:var(--spacing-md);font-weight:600;}

.modal-details{display:flex;flex-direction:column;gap:var(--spacing-md);}
.detail-item{padding:var(--spacing-md);background:rgba(77,163,255,.05);border-left:3px solid var(--a1);border-radius:var(--radius-sm);}
.detail-label{font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
.detail-value{font-size:13px;color:var(--ink);}

.team-members{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--spacing-md);}
.team-member{text-align:center;padding:var(--spacing-md);background:rgba(26,25,31,.8);border-radius:var(--radius-md);border:1px solid var(--dim);cursor:pointer;transition:border-color var(--transition-fast),background var(--transition-fast);}
.team-member:hover{border-color:rgba(77,163,255,.35);background:rgba(26,25,31,1);}
.member-avatar{width:64px;height:64px;border-radius:50%;background:var(--dim);margin:0 auto;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:20px;color:var(--a1);overflow:hidden;transition:box-shadow var(--transition-fast);}
.team-member.revealed .member-avatar{box-shadow:0 0 0 2px var(--a1);}
.member-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.member-info{max-height:0;opacity:0;overflow:hidden;transition:max-height var(--transition-normal) ease,opacity var(--transition-normal) ease,margin-top var(--transition-normal) ease;}
.team-member.revealed .member-info{max-height:60px;opacity:1;margin-top:var(--spacing-sm);}
.member-name{font-size:12px;color:var(--ink);font-weight:500;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;}
.head-badge{font-size:8px;line-height:1;padding:3px 6px;background:var(--a1);color:#000;border-radius:999px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
.member-role{font-size:9px;color:var(--muted);margin-top:2px;}
.member-hint{font-size:9px;color:var(--muted);margin-top:var(--spacing-xs);text-transform:uppercase;letter-spacing:.5px;opacity:.7;}
.team-member.revealed .member-hint{display:none;}

.modal-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--spacing-md);}
.modal-stat{background:rgba(77,163,255,.08);border:1px solid rgba(77,163,255,.2);border-radius:var(--radius-md);padding:var(--spacing-lg);text-align:center;}
.modal-stat-value{font-size:24px;font-weight:700;color:var(--a1);margin-bottom:4px;}
.modal-stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}

.modal-action{display:flex;gap:var(--spacing-md);margin-top:var(--spacing-xl);}
.btn{flex:1;padding:var(--spacing-md);border-radius:var(--radius-md);border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all var(--transition-fast);text-transform:uppercase;letter-spacing:.5px;}
.btn-primary{background:var(--a1);color:#000;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(77,163,255,.3);}
.btn-secondary{background:var(--dim);color:var(--ink);border:1px solid var(--dim);}
.btn-secondary:hover{border-color:var(--a1);color:var(--a1);}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideIn{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}


/* ===== RESPONSIVE ===== */
@media (max-width:768px){
  .dashboard-grid{grid-template-columns:1fr;}
  .header-container{flex-direction:column;text-align:center;}
  .header-stats{width:100%;justify-content:space-around;}
  .controls-wrapper{flex-direction:column;}
  .search-box{min-width:100%;}
  .modal-content{width:95%;padding:var(--spacing-lg);}
  .team-members{grid-template-columns:repeat(auto-fit,minmax(100px,1fr));}
}

/* Empty State */
.empty-state{text-align:center;padding:var(--spacing-xl);grid-column:1/-1;}
.empty-icon{font-size:48px;margin-bottom:var(--spacing-md);opacity:.5;}
.empty-text{color:var(--muted);font-size:14px;}

</style>
</head>

/**
 * Initialize Dashboard
 */
function initDashboard() {
  renderCards(adminPanelsData);
  setupEventListeners();
  updateHeaderStats();
}

/**
 * Update header statistics
 */
function updateHeaderStats() {
  const totalUsers = adminPanelsData.reduce((sum, p) => sum + p.team.length, 0);

  document.getElementById('total-panels').textContent = adminPanelsData.length;
  document.getElementById('total-users').textContent = totalUsers;
}

/**
 * Render cards in dashboard
 */
function renderCards(data) {
  const grid = document.getElementById('dashboardGrid');
  
  if (data.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">No projects found. Try adjusting your filters.</div>
      </div>
    `;
    return;
  }

  grid.innerHTML = data.map((panel, index) => `
    <div class="flip-card" data-id="${panel.id}" onclick="toggleCard(this)">
      <div class="flip-card-inner">
        <!-- FRONT -->
        <div class="flip-card-front">
          <div class="card-header">
            <div class="card-category">${panel.category}</div>
            <h3 class="card-title">${panel.name}</h3>
            <p style="font-size:12px;color:var(--muted);margin-top:var(--spacing-sm);">${panel.shortDesc}</p>
          </div>
          <div class="card-footer">
            <div class="card-stats-mini">
              <div class="stat-mini">
                <div class="stat-mini-val">${Object.values(panel.stats)[0]}</div>
                <div class="stat-mini-label">${Object.keys(panel.stats)[0].replace(/_/g,' ')}</div>
              </div>
              <div class="stat-mini">
                <div class="stat-mini-val">${panel.team.length}</div>
                <div class="stat-mini-label">Team</div>
              </div>
            </div>
            <span class="card-hint">⟲ Click for full details</span>
          </div>
        </div>

        <!-- BACK: full info -->
        <div class="flip-card-back full-info">
          <div class="back-content-full">
            <h4 class="back-title">${panel.name}</h4>

            <div class="back-stats-grid">
              ${Object.entries(panel.stats).map(([key, value]) => `
                <div class="back-stat">
                  <div class="back-stat-val">${value}</div>
                  <div class="back-stat-label">${key.replace(/_/g, ' ')}</div>
                </div>
              `).join('')}
            </div>

            <div class="back-section-label">Details</div>
            <ul class="back-details-list">
              ${panel.details.map(d => `<li>${d}</li>`).join('')}
            </ul>

            <div class="back-section-label">Team (${panel.team.length})</div>
            <div class="back-team-grid">
              ${panel.team.map(member => `
                <div class="back-team-card" onclick="event.stopPropagation(); this.classList.toggle('revealed')">
                  <div class="back-team-avatar">${TEAM_PHOTOS[member.name] ? `<img src="${TEAM_PHOTOS[member.name]}" alt="${member.name}">` : member.name.charAt(0)}</div>
                  <div class="back-team-caption">Tap for info</div>
                  <div class="back-team-reveal">
                    <span class="back-team-name">${member.name}${member.isHead ? '<span class="head-badge">Head</span>' : ''}</span>
                    <span class="back-team-role">${member.role}</span>
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="back-section-label">Tags</div>
            <div class="back-tags">${panel.tags.map(t => `<span class="back-tag">${t}</span>`).join('')}</div>

          </div>
          <button class="back-action" onclick="event.stopPropagation(); openAdminPanel('${panel.adminLink}')">Open Admin Panel ↗</button>
        </div>
      </div>
    </div>
  `).join('');
}

/**
 * Toggle a card between front (summary) and back (full info).
 * The card grows/shrinks in place with normal document flow — no scrolling needed.
 */
function toggleCard(cardEl) {
  cardEl.classList.toggle('flipped');
}

/**
 * Open admin panel
 */
function openAdminPanel(link) {
  if (link) {
    window.open(link, '_blank');
  }
}

/**
 * Setup event listeners
 */
function setupEventListeners() {
  // Search
  document.getElementById('searchInput').addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase();
    filteredData = adminPanelsData.filter(panel => 
      panel.name.toLowerCase().includes(query) ||
      panel.category.toLowerCase().includes(query) ||
      panel.tags.some(tag => tag.includes(query))
    );
    renderCards(filteredData);
  });

  // Filters
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');

      const filter = e.target.dataset.filter;
      if (filter === 'all') {
        filteredData = [...adminPanelsData];
      } else {
        filteredData = adminPanelsData.filter(p => p.category === filter);
      }
      renderCards(filteredData);
    });
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Home') location.href = 'index.html';
  });
}

// Initialize on load
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initDashboard);
} else {
  initDashboard();
}
