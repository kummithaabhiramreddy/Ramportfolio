<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40" shape-rendering="geometricPrecision">
  <defs>
    <!-- Sharp Gold Orbit Gradient -->
    <linearGradient id="goldOrbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0c4" />
      <stop offset="50%" stop-color="#e5c17d" />
      <stop offset="100%" stop-color="#ffd980" />
    </linearGradient>

    <!-- Vibrant Neon Emerald Arc Gradient -->
    <linearGradient id="emeraldArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffaa" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>
  </defs>

  <!-- Slanted Bright Gold Orbit Ring -->
  <ellipse cx="50" cy="48" rx="36" ry="15" fill="none" stroke="url(#goldOrbitGrad)" stroke-width="4.5" transform="rotate(-18 50 48)" stroke-linecap="round" />

  <!-- Lower Bright Emerald Crescent Arc -->
  <path d="M 18 54 A 34 20 0 0 0 82 54" fill="none" stroke="url(#emeraldArcGrad)" stroke-width="6.5" stroke-linecap="round" />

  <!-- Top-Left Vibrant Accent Dot -->
  <circle cx="18" cy="38" r="4.5" fill="#00ffaa" />

  <!-- Central Sharp Pure White Sphere Core -->
  <circle cx="50" cy="48" r="10.5" fill="#ffffff" />
</svg>
