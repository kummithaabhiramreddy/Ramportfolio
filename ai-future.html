<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Future — Kummitha Abhiram Reddy</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#09090e; --surface:#111118; --ink:#e8e6f0; --muted:#6a6878;
  --dim:#2e2c3a; --a1:#c8f135; --a2:#7b61ff; --a3:#ff5e3a; --a4:#00d4aa; --a5:#f5a623;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
a,button{-webkit-tap-highlight-color:transparent;outline:none;}
html{scroll-behavior:smooth;font-size:16px;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;}
::selection{background:var(--a1);color:#09090e;}

/* ---- Top bar ---- */
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 40px;border-bottom:1px solid rgba(232,230,240,.12);background:rgba(9,9,14,.7);backdrop-filter:blur(8px);}
.nav-left{display:flex;align-items:center;gap:12px;}
.nav-logo-link{position:relative;width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid #000;flex-shrink:0;display:block;}
.nav-logo-img{width:100%;height:100%;object-fit:cover;display:block;}
.nav-page-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.home-btn{display:inline-flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink);text-decoration:none;border:1px solid var(--dim);padding:9px 16px;border-radius:999px;transition:border-color .2s,color .2s,background .2s;}
.home-btn:hover{border-color:var(--a1);color:var(--a1);background:rgba(200,241,53,.06);}
.home-btn svg{width:14px;height:14px;flex-shrink:0;}

/* ---- Page wrap: the widget renders full-page here instead of a floating corner card ---- */
.page-wrap{padding:96px 16px 40px;display:flex;justify-content:center;min-height:100vh;}

/* AI Future Chat Box Styles */
.ai-future-btn{
  display:flex; align-items:center; gap:7px;
  padding:8px 13px; border-radius:20px;
  background:transparent; border:1px solid var(--dim);
  color:var(--muted); font-family:'DM Sans', sans-serif;
  font-size:12.5px; font-weight:500; cursor:pointer;
  transition:color .2s,background .2s;
  white-space:nowrap;
}
.ai-future-btn:hover{color:var(--ink);background:var(--dim);}

.ai-future-chatbox-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.5);
  z-index:99998; opacity:0; pointer-events:none;
  transition:opacity .2s ease;
}
.ai-future-chatbox-overlay.open{ opacity:1; pointer-events:auto; }

.ai-future-chatbox{
  position:fixed; bottom:20px; right:20px; width:380px;
  background:var(--surface); border:1px solid var(--dim);
  border-radius:12px; box-shadow:0 20px 50px rgba(0,0,0,0.5);
  z-index:99999; opacity:0; transform:translateY(20px); pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
  display:flex; flex-direction:column; max-height:500px;
}
.ai-future-chatbox.open{ opacity:1; transform:translateY(0); pointer-events:auto; }
.ai-future-chatbox.resizing{ transition:none !important; user-select:none; }

/* Resize handles — grab an edge (anywhere along it, including the middle)
   or a corner and drag out to grow the card, or drag in to shrink it. */
.cog-resize-handle{ position:absolute; z-index:20; background:transparent; touch-action:none; }
.cog-resize-handle:hover, .cog-resize-handle.active{ background:rgba(200,241,53,.18); }
.cog-resize-n, .cog-resize-s{ left:14px; right:14px; height:9px; cursor:ns-resize; }
.cog-resize-n{ top:-5px; border-radius:6px 6px 0 0; }
.cog-resize-s{ bottom:-5px; border-radius:0 0 6px 6px; }
.cog-resize-e, .cog-resize-w{ top:14px; bottom:14px; width:9px; cursor:ew-resize; }
.cog-resize-e{ right:-5px; border-radius:0 6px 6px 0; }
.cog-resize-w{ left:-5px; border-radius:6px 0 0 6px; }
.cog-resize-ne, .cog-resize-nw, .cog-resize-se, .cog-resize-sw{ width:16px; height:16px; }
.cog-resize-ne{ top:-5px; right:-5px; cursor:nesw-resize; }
.cog-resize-nw{ top:-5px; left:-5px; cursor:nwse-resize; }
.cog-resize-se{ bottom:-5px; right:-5px; cursor:nwse-resize; }
.cog-resize-sw{ bottom:-5px; left:-5px; cursor:nesw-resize; }

.ai-future-chatbox-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; border-bottom:1px solid var(--dim);
  font-family:'Instrument Serif',serif; font-weight:500; font-size:14px;
  color:var(--ink);
}
.ai-future-chatbox-close{
  background:none; border:none; color:var(--muted); cursor:pointer;
  font-size:20px; transition:color .15s ease;
}
.ai-future-chatbox-close:hover{ color:var(--ink); }

.ai-future-chatbox-body{
  flex:1; padding:14px 16px; overflow-y:auto;
  display:flex; flex-direction:column; gap:10px;
}

.ai-future-search-bar{
  display:flex; align-items:center; gap:8px;
  padding:0 12px; background:var(--bg); border:1px solid var(--dim);
  border-radius:8px; transition:border-color .15s ease;
  margin:0 16px 14px 16px;
}
.ai-future-search-bar:focus-within{ border-color:var(--a1); }
.ai-future-search-bar input{
  flex:1; padding:10px 0; background:none; border:none;
  color:var(--ink); font-family:'DM Sans', sans-serif;
  font-size:12px; outline:none;
}
.ai-future-search-bar input::placeholder{ color:var(--muted); }
.ai-future-search-bar button{
  background:none; border:none; color:var(--a1); cursor:pointer;
  font-size:16px; transition:transform .15s ease;
}
.ai-future-search-bar button:hover{ transform:scale(1.1); }

.ai-future-chat-message{
  padding:10px 12px; border-radius:8px; font-size:12px;
  line-height:1.4; animation:slideIn .3s ease;
}
.ai-future-chat-message.user{
  background:rgba(200,241,53,0.15); color:var(--ink); margin-left:20px;
}
.ai-future-chat-message.ai{
  background:var(--bg); color:var(--muted); margin-right:20px;
}

@keyframes slideIn{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}

/* AI Future Tabs (Search / Messages) */
.ai-future-tabs{
  display:flex; gap:6px; padding:10px 16px 0 16px;
}
.ai-future-tab{
  flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
  padding:8px 10px; border-radius:8px; border:1px solid var(--dim);
  background:transparent; color:var(--muted);
  font-family:'DM Sans',sans-serif; font-size:11.5px; font-weight:500;
  cursor:pointer; transition:color .15s ease,background .15s ease,border-color .15s ease;
}
.ai-future-tab:hover{ color:var(--ink); }
.ai-future-tab.active{ color:var(--bg); background:var(--a1); border-color:var(--a1); }

/* In-card result view — search result links open here, inside the widget,
   instead of navigating to a new browser tab/page. */
.cog-result-view{
  position:absolute; inset:0; background:var(--surface); border-radius:12px;
  display:flex; flex-direction:column; opacity:0; pointer-events:none;
  transition:opacity .15s ease; z-index:5;
}
.cog-result-view.open{ opacity:1; pointer-events:auto; }
.cog-result-head{
  display:flex; align-items:center; gap:8px; padding:12px 14px;
  border-bottom:1px solid var(--dim); flex-shrink:0;
}
.cog-result-back{
  background:none; border:1px solid var(--dim); color:var(--ink); cursor:pointer;
  width:28px; height:28px; border-radius:50%; font-size:14px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; transition:border-color .15s ease;
}
.cog-result-back:hover{ border-color:var(--a1); }
.cog-result-label{
  font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; flex:1; min-width:0;
}
.cog-result-body{ flex:1; position:relative; }
.cog-result-body iframe{ width:100%; height:100%; border:none; display:block; background:#fff; }
.cog-result-loading{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--muted); font-family:'DM Mono',monospace; font-size:11px; background:var(--surface);
}
.cog-result-loading.hidden{ display:none; }

/* Messages Panel */
.ai-future-messages-panel{
  flex:1; display:flex; flex-direction:column; min-height:280px; overflow:hidden;
}

/* Name entry / new-chat entry screens */
.msg-entry-screen{
  flex:1; display:flex; flex-direction:column; align-items:stretch; justify-content:center;
  gap:12px; padding:20px 18px;
}
.msg-entry-title{
  font-family:'Instrument Serif',serif; font-size:16px; color:var(--ink); text-align:center;
}
.msg-entry-sub{
  font-size:11.5px; color:var(--muted); text-align:center; margin-top:-6px;
}
.msg-entry-input{
  width:100%; background:var(--bg); border:1px solid var(--dim); border-radius:8px;
  padding:10px 12px; color:var(--ink); font-family:'DM Sans',sans-serif; font-size:12.5px; outline:none;
  transition:border-color .15s ease;
}
.msg-entry-input:focus{ border-color:var(--a1); }
.msg-entry-btn{
  background:var(--a1); color:var(--bg); border:none; border-radius:8px;
  padding:10px 12px; font-family:'DM Sans',sans-serif; font-size:12.5px; font-weight:600;
  cursor:pointer; transition:opacity .15s ease;
}
.msg-entry-btn:hover{ opacity:.85; }
.msg-entry-back{
  background:none; border:none; color:var(--muted); font-size:11.5px; cursor:pointer;
  text-align:center; text-decoration:underline; font-family:'DM Sans',sans-serif;
}

/* Chat list (WhatsApp-style contact list) */
.msg-chat-list{ flex:1; overflow-y:auto; display:flex; flex-direction:column; }
.msg-chat-list-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px; font-size:11px; color:var(--muted); font-family:'DM Mono',monospace;
  text-transform:uppercase; letter-spacing:1px;
}
.msg-new-chat-btn{
  background:none; border:1px solid var(--dim); color:var(--a1); border-radius:14px;
  padding:4px 10px; font-size:11px; cursor:pointer; font-family:'DM Sans',sans-serif;
}
.msg-new-chat-btn:hover{ border-color:var(--a1); }
.msg-chat-list-item{
  display:flex; align-items:center; gap:10px; padding:10px 16px; cursor:pointer;
  border-bottom:1px solid rgba(232,230,240,.06); transition:background .15s ease;
}
.msg-chat-list-item:hover{ background:var(--dim); }
.msg-chat-avatar{
  width:34px; height:34px; border-radius:50%; background:var(--a2); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600;
  flex-shrink:0; text-transform:uppercase; font-family:'DM Sans',sans-serif;
}
.msg-chat-info{ flex:1; min-width:0; }
.msg-chat-name{ font-size:12.5px; color:var(--ink); font-weight:500; }
.msg-chat-preview{
  font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.msg-chat-empty{
  flex:1; display:flex; align-items:center; justify-content:center;
  color:var(--muted); font-size:11.5px; padding:20px; text-align:center;
}

/* Conversation view */
.msg-conversation{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
.msg-conv-header{
  display:flex; align-items:center; gap:10px; padding:10px 16px;
  border-bottom:1px solid var(--dim);
}
.msg-conv-back{
  background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; line-height:1;
}
.msg-conv-back:hover{ color:var(--ink); }
.msg-conv-name{ font-size:13px; color:var(--ink); font-weight:500; }
.msg-conv-body{
  flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:8px;
}
.msg-bubble{
  max-width:78%; padding:8px 11px; border-radius:10px; font-size:12px; line-height:1.4;
  animation:slideIn .25s ease; word-wrap:break-word;
}
.msg-bubble.sent{
  background:rgba(200,241,53,0.15); color:var(--ink); align-self:flex-end; border-bottom-right-radius:2px;
}
.msg-bubble.received{
  background:var(--bg); border:1px solid var(--dim); color:var(--ink); align-self:flex-start; border-bottom-left-radius:2px;
}
.msg-bubble-time{
  display:block; margin-top:3px; font-size:9px; color:var(--muted); font-family:'DM Mono',monospace;
}
.msg-conv-input-bar{
  display:flex; align-items:center; gap:8px; padding:0 12px;
  background:var(--bg); border:1px solid var(--dim); border-radius:8px;
  margin:0 16px 14px 16px; transition:border-color .15s ease;
}
.msg-conv-input-bar:focus-within{ border-color:var(--a1); }
.msg-conv-input-bar input{
  flex:1; padding:10px 0; background:none; border:none; color:var(--ink);
  font-family:'DM Sans',sans-serif; font-size:12px; outline:none;
}
.msg-conv-input-bar input::placeholder{ color:var(--muted); }
.msg-conv-input-bar button{
  background:none; border:none; color:var(--a1); cursor:pointer; font-size:16px;
  transition:transform .15s ease;
}
.msg-conv-input-bar button:hover{ transform:scale(1.1); }

/* Extra input-bar icon buttons: attach / mic / emoji (shared) */
.ai-future-search-bar,.msg-conv-input-bar{ position:relative; padding:0 8px; }
.cog-input-icon{
  background:none; border:none; color:var(--muted); cursor:pointer;
  font-size:16px; width:26px; height:26px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%; transition:color .15s ease,background .15s ease,transform .15s ease;
}
.cog-input-icon:hover{ color:var(--a1); background:var(--dim); transform:scale(1.08); }
.cog-input-icon.cog-mic-active{ color:var(--a3); animation:cogPulse 1s ease-in-out infinite; }
@keyframes cogPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
.cog-file-input{ display:none; }

/* Pending attachment chips — shown above the input bar before sending */
.cog-attach-chips{
  display:none; flex-wrap:wrap; gap:8px; padding:10px 16px 0 16px;
}
.cog-attach-chips.has-items{ display:flex; }
.cog-attach-chip{
  position:relative; display:flex; align-items:center; gap:6px;
  background:var(--surface); border:1px solid var(--dim); border-radius:8px;
  padding:5px 26px 5px 6px; max-width:160px;
}
.cog-attach-chip-thumb{
  width:26px; height:26px; border-radius:5px; object-fit:cover; flex-shrink:0; background:var(--dim);
}
.cog-attach-chip-icon{
  width:26px; height:26px; border-radius:5px; flex-shrink:0; background:var(--dim);
  display:flex; align-items:center; justify-content:center; font-size:13px;
}
.cog-attach-chip-name{
  font-size:11px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.cog-attach-chip-remove{
  position:absolute; top:2px; right:2px; width:16px; height:16px; border-radius:50%;
  background:var(--dim); color:var(--ink); border:none; cursor:pointer; font-size:11px;
  line-height:1; display:flex; align-items:center; justify-content:center;
}
.cog-attach-chip-remove:hover{ background:var(--a3); color:#fff; }
.cog-attach-chip-pending{ opacity:.65; }
.cog-attach-chip-loading{ animation:cogPulse 1s ease-in-out infinite; }

/* Sent attachments — rendered inside chat bubbles / messages, clickable to open anytime */
.cog-msg-attachments{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
.cog-msg-attachments:first-child{ margin-top:0; }
.cog-attach-link{
  display:flex; align-items:center; gap:6px; text-decoration:none;
  background:rgba(255,255,255,.06); border:1px solid var(--dim); border-radius:8px;
  padding:5px 10px 5px 5px; max-width:190px; transition:border-color .15s ease;
}
.cog-attach-link:hover{ border-color:var(--a1); }
.cog-attach-link img{ width:28px; height:28px; border-radius:5px; object-fit:cover; flex-shrink:0; }
.cog-attach-link-icon{
  width:28px; height:28px; border-radius:5px; flex-shrink:0; background:var(--dim);
  display:flex; align-items:center; justify-content:center; font-size:13px;
}
.cog-attach-link-name{
  font-size:11.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* Attachment preview modal — opens on click before any download happens */
.cog-preview-overlay{
  display:none; position:fixed; inset:0; z-index:900; background:rgba(5,5,8,.82);
  backdrop-filter:blur(4px); align-items:center; justify-content:center; padding:24px;
}
.cog-preview-overlay.open{ display:flex; }
.cog-preview-card{
  background:var(--surface); border:1px solid var(--dim); border-radius:14px;
  width:100%; max-width:480px; max-height:86vh; display:flex; flex-direction:column;
  overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.cog-preview-head{
  display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--dim);
}
.cog-preview-head-icon{
  width:30px; height:30px; border-radius:7px; background:var(--dim); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:14px;
}
.cog-preview-head-name{
  font-size:13px; color:var(--ink); font-weight:500; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; flex:1; min-width:0;
}
.cog-preview-close{
  background:none; border:none; color:var(--muted); font-size:20px; line-height:1;
  cursor:pointer; width:28px; height:28px; border-radius:50%; flex-shrink:0;
}
.cog-preview-close:hover{ background:var(--dim); color:var(--ink); }
.cog-preview-body{
  flex:1; min-height:120px; overflow:auto; display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.02); padding:16px;
}
.cog-preview-body img{ max-width:100%; max-height:60vh; border-radius:8px; display:block; }
.cog-preview-body video{ max-width:100%; max-height:60vh; border-radius:8px; display:block; }
.cog-preview-body audio{ width:100%; }
.cog-preview-body iframe{ width:100%; height:60vh; border:none; border-radius:8px; background:#fff; }
.cog-preview-generic{ text-align:center; color:var(--muted); font-size:13px; }
.cog-preview-generic .cog-preview-generic-icon{ font-size:40px; display:block; margin-bottom:10px; }
.cog-preview-actions{
  display:flex; justify-content:center; gap:10px; padding:14px 16px; border-top:1px solid var(--dim);
}
.cog-preview-download{
  font-family:'DM Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase;
  padding:10px 20px; border-radius:6px; cursor:pointer; border:1px solid var(--a1);
  background:var(--a1); color:#09090e; text-decoration:none; display:inline-flex; align-items:center; gap:6px;
}
.cog-preview-download:hover{ opacity:.88; }

/* Emoji picker */
.cog-emoji-picker{
  position:absolute; bottom:calc(100% + 8px); left:16px; right:16px;
  background:var(--surface); border:1px solid var(--dim); border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.45); z-index:100000;
  display:none; flex-direction:column; overflow:hidden;
}
.cog-emoji-picker.open{ display:flex; }
.cog-emoji-search{
  border:none; border-bottom:1px solid var(--dim); background:var(--bg);
  color:var(--ink); font-family:'DM Sans',sans-serif; font-size:12px;
  padding:9px 12px; outline:none; width:100%;
}
.cog-emoji-search::placeholder{ color:var(--muted); }
.cog-emoji-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(30px,1fr));
  gap:2px; padding:8px; max-height:190px; overflow-y:auto;
}
.cog-emoji-grid button{
  background:none; border:none; font-size:18px; line-height:1; cursor:pointer;
  padding:5px 0; border-radius:6px; transition:background .12s ease,transform .12s ease;
}
.cog-emoji-grid button:hover{ background:var(--dim); transform:scale(1.15); }
.cog-emoji-empty{ padding:20px; text-align:center; color:var(--muted); font-size:11.5px; grid-column:1/-1; }

/* ---- Overrides: turn the floating widget into a full-page panel ---- */
.ai-future-chatbox-overlay{ display:none !important; }
.ai-future-chatbox{
  position:static !important;
  opacity:1 !important; transform:none !important; pointer-events:auto !important;
  width:100% !important; max-width:640px;
  height:min(78vh,760px) !important; max-height:none !important;
  margin:0 auto;
}
.cog-resize-handle{ display:none !important; }
.ai-future-chatbox-close{ cursor:pointer; }

@media (max-width:900px){
  nav{padding:12px 20px;gap:10px;}
}
@media (max-width:680px){
  .page-wrap{padding:88px 0 0;}
  .ai-future-chatbox{ max-width:100%; height:calc(100vh - 88px) !important; border-radius:0; }
  .home-btn span{display:none;}
}
</style>
</head>
<body>

<nav>

<script>
// AI Future Chat Functions
window.openAIFutureChat = function() {
  const chatbox = document.getElementById('aiFutureChatbox');
  const overlay = document.getElementById('aiFutureChatOverlay');
  if(!chatbox || !overlay) return;
  chatbox.classList.add('open');
  overlay.classList.add('open');
  const input = document.getElementById('aiFutureSearchInput');
  if(input) input.focus();
};

window.closeAIFutureChat = function() {
  const chatbox = document.getElementById('aiFutureChatbox');
  const overlay = document.getElementById('aiFutureChatOverlay');
  if(!chatbox || !overlay) return;
  chatbox.classList.remove('open');
  overlay.classList.remove('open');
};

window.sendAIFutureSearch = function() {
  const input = document.getElementById('aiFutureSearchInput');
  if(!input) return;
  const query = input.value.trim();
  const allPending = cogPendingAttachments.search;
  // Only files that have finished reading are ready to send; files still
  // loading stay staged in the bar so they aren't lost if send is hit early.
  const ready = allPending.filter(a => !a.loading);
  const stillLoading = allPending.filter(a => a.loading);

  if (!query && !ready.length) return; // nothing ready to send yet

  const chatBody = document.getElementById('aiFutureChatBody');
  if(!chatBody) return;

  // Add user message to chat (text + any attached files, both clickable/reopenable)
  const userMsg = document.createElement('div');
  userMsg.className = 'ai-future-chat-message user';
  userMsg.innerHTML = (query ? cogEscape(query) : '') + cogRenderAttachments(ready);
  chatBody.appendChild(userMsg);

  // Clear the staged attachments that were just sent, keep any still-loading ones
  cogPendingAttachments.search = stillLoading;
  cogRenderAttachChips('search');

  // Add typing indicator
  const typingMsg = document.createElement('div');
  typingMsg.className = 'ai-future-chat-message ai';
  typingMsg.textContent = 'Searching Cognisphereai...';
  typingMsg.id = 'typingMsg';
  chatBody.appendChild(typingMsg);
  
  // Scroll to bottom
  chatBody.scrollTop = chatBody.scrollHeight;
  
  // Simulate search and open Cognisphereai link
  setTimeout(() => {
    const typing = document.getElementById('typingMsg');
    if (typing) typing.remove();

    const aiMsg = document.createElement('div');
    aiMsg.className = 'ai-future-chat-message ai';
    if (query) {
      const resultUrl = 'https://cognisphereai.vercel.app/home.html?q=' + encodeURIComponent(query);
      aiMsg.appendChild(document.createTextNode(`Here's what I found for: "${query}" `));
      aiMsg.appendChild(document.createElement('br'));
      // Clicking this opens the result inside the Cognisphereai card itself
      // (via cogOpenResult), never a new browser tab/page.
      const resultLink = document.createElement('a');
      resultLink.href = 'javascript:void(0)';
      resultLink.style.color = 'var(--a1)';
      resultLink.style.textDecoration = 'none';
      resultLink.style.cursor = 'pointer';
      resultLink.textContent = resultUrl + ' →';
      resultLink.addEventListener('click', function(e){
        e.preventDefault();
        cogOpenResult(resultUrl, 'Cognisphereai — ' + query);
      });
      aiMsg.appendChild(resultLink);
    } else {
      aiMsg.textContent = 'Got your file — you can reopen it anytime by tapping it above.';
    }
    chatBody.appendChild(aiMsg);
    
    chatBody.scrollTop = chatBody.scrollHeight;
  }, 800);
  
  input.value = '';
};

// Allow Enter key to send search
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('aiFutureSearchInput');
  if (searchInput) {
    searchInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        window.sendAIFutureSearch();
      }
    });
  }
});

// Initialize on load
// Note: overlay click-to-close intentionally disabled.
// Only the × button in the chat box header closes the chat box.

// ==== AI Future Tabs (Search / Messages) ====
window.switchAIFutureTab = function(tab) {
  const searchBar = document.getElementById('aiFutureSearchBar');
  const chatBody = document.getElementById('aiFutureChatBody');
  const msgPanel = document.getElementById('aiFutureMessagesPanel');
  const tabSearch = document.getElementById('aiFutureTabSearch');
  const tabMessages = document.getElementById('aiFutureTabMessages');
  if (!searchBar || !chatBody || !msgPanel || !tabSearch || !tabMessages) return;

  if (tab === 'search') {
    chatBody.style.display = 'flex';
    searchBar.style.display = 'flex';
    msgPanel.style.display = 'none';
    tabSearch.classList.add('active');
    tabMessages.classList.remove('active');
  } else {
    chatBody.style.display = 'none';
    searchBar.style.display = 'none';
    msgPanel.style.display = 'flex';
    tabMessages.classList.add('active');
    tabSearch.classList.remove('active');
    renderAIFutureMessages();
  }
};

// ==== WhatsApp-style Messages (persisted locally, survives refresh) ====
const COG_MSG_KEY = 'cogMessengerData';
let cogActiveChat = null; // recipient name of the currently open conversation

// Card resize — grab any edge (including its middle, not just the corners)
// and drag outward to extend the card, or drag inward to shrink it back down.
document.addEventListener('DOMContentLoaded', function(){
  const box = document.getElementById('aiFutureChatbox');
  if(!box) return;
  const MIN_W = 300, MIN_H = 320;
  let resizing = null;

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
  function maxDims(){
    return { maxW: Math.min(window.innerWidth - 24, 720), maxH: Math.min(window.innerHeight - 24, 800) };
  }
  function pointOf(e){
    const t = e.touches && e.touches[0];
    return { x: t ? t.clientX : e.clientX, y: t ? t.clientY : e.clientY };
  }

  function startResize(e, dir, handleEl){
    e.preventDefault();
    e.stopPropagation();
    const rect = box.getBoundingClientRect();
    // Freeze the card to explicit left/top/width/height so any edge can
    // drive the resize, regardless of its usual bottom/right anchoring.
    box.style.right = 'auto';
    box.style.bottom = 'auto';
    box.style.left = rect.left + 'px';
    box.style.top = rect.top + 'px';
    box.style.width = rect.width + 'px';
    box.style.height = rect.height + 'px';
    box.style.maxHeight = 'none';
    box.classList.add('resizing');
    handleEl.classList.add('active');

    const p = pointOf(e);
    resizing = { dir, handleEl, startX: p.x, startY: p.y, startLeft: rect.left, startTop: rect.top, startW: rect.width, startH: rect.height };

    document.addEventListener('mousemove', onResizeMove);
    document.addEventListener('mouseup', stopResize);
    document.addEventListener('touchmove', onResizeMove, { passive:false });
    document.addEventListener('touchend', stopResize);
  }

  function onResizeMove(e){
    if(!resizing) return;
    e.preventDefault();
    const p = pointOf(e);
    const dx = p.x - resizing.startX;
    const dy = p.y - resizing.startY;
    const { maxW, maxH } = maxDims();
    const { dir, startLeft, startTop, startW, startH } = resizing;
    let newLeft = startLeft, newTop = startTop, newW = startW, newH = startH;

    // Pulling an edge (or corner) away from the card extends it in that
    // direction; pushing it back toward the card's center shrinks it.
    if(dir.includes('e')){ newW = clamp(startW + dx, MIN_W, maxW); }
    if(dir.includes('s')){ newH = clamp(startH + dy, MIN_H, maxH); }
    if(dir.includes('w')){
      newW = clamp(startW - dx, MIN_W, maxW);
      newLeft = startLeft + (startW - newW);
    }
    if(dir.includes('n')){
      newH = clamp(startH - dy, MIN_H, maxH);
      newTop = startTop + (startH - newH);
    }

    // Keep the card fully on-screen while resizing.
    newLeft = clamp(newLeft, 4, window.innerWidth - newW - 4);
    newTop = clamp(newTop, 4, window.innerHeight - newH - 4);

    box.style.left = newLeft + 'px';
    box.style.top = newTop + 'px';
    box.style.width = newW + 'px';
    box.style.height = newH + 'px';
  }

  function stopResize(){
    if(!resizing) return;
    resizing.handleEl.classList.remove('active');
    resizing = null;
    box.classList.remove('resizing');
    document.removeEventListener('mousemove', onResizeMove);
    document.removeEventListener('mouseup', stopResize);
    document.removeEventListener('touchmove', onResizeMove);
    document.removeEventListener('touchend', stopResize);
  }

  box.querySelectorAll(':scope > .cog-resize-handle').forEach(function(handle){
    const dir = handle.getAttribute('data-dir');
    handle.addEventListener('mousedown', function(e){ startResize(e, dir, handle); });
    handle.addEventListener('touchstart', function(e){ startResize(e, dir, handle); }, { passive:false });
  });
});

function cogGetData(){
  try {
    const raw = localStorage.getItem(COG_MSG_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return { userName: '', conversations: {} };
}
function cogSaveData(data){
  try { localStorage.setItem(COG_MSG_KEY, JSON.stringify(data)); } catch(e){}
}
// Opens a Cognisphereai search result inside the card itself (an iframe
// overlay), instead of navigating away to a new browser tab/page.
window.cogOpenResult = function(url, label){
  const view = document.getElementById('cogResultView');
  const frame = document.getElementById('cogResultFrame');
  const loading = document.getElementById('cogResultLoading');
  const labelEl = document.getElementById('cogResultLabel');
  if (!view || !frame) return;
  if (labelEl) labelEl.textContent = label || url;
  if (loading) loading.classList.remove('hidden');
  frame.style.visibility = 'hidden';
  frame.onload = function(){
    if (loading) loading.classList.add('hidden');
    frame.style.visibility = 'visible';
  };
  frame.src = url;
  view.classList.add('open');
};

// Closes the in-card result view and returns to the chat/search view.
window.cogCloseResultView = function(){
  const view = document.getElementById('cogResultView');
  const frame = document.getElementById('cogResultFrame');
  const loading = document.getElementById('cogResultLoading');
  if (view) view.classList.remove('open');
  if (frame) frame.src = 'about:blank';
  if (loading) loading.classList.remove('hidden');
};

function cogEscape(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function cogInitials(name){
  return (name || '?').trim().slice(0,2).toUpperCase();
}
function cogTimeNow(){
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

window.renderAIFutureMessages = function(){
  const data = cogGetData();
  const panel = document.getElementById('aiFutureMessagesPanel');
  if (!panel) return;

  // Step 1: first time here -> ask sender's name
  if (!data.userName) {
    panel.innerHTML = `
      <div class="msg-entry-screen">
        <div class="msg-entry-title">Let's get you set up</div>
        <div class="msg-entry-sub">What's your name?</div>
        <input type="text" class="msg-entry-input" id="cogNameInput" placeholder="Your name" autocomplete="off" />
        <button class="msg-entry-btn" onclick="cogSaveName()">Continue</button>
      </div>`;
    const inp = document.getElementById('cogNameInput');
    if (inp) {
      inp.focus();
      inp.addEventListener('keypress', e => { if (e.key === 'Enter') cogSaveName(); });
    }
    return;
  }

  // Step 2: a conversation is open -> show it (with full history, like WhatsApp)
  if (cogActiveChat) {
    cogRenderConversation(cogActiveChat);
    return;
  }

  // Step 3: default -> show the list of all chats
  cogRenderChatList();
};

window.cogSaveName = function(){
  const inp = document.getElementById('cogNameInput');
  if (!inp) return;
  const name = inp.value.trim();
  if (!name) return;
  const data = cogGetData();
  data.userName = name;
  cogSaveData(data);
  renderAIFutureMessages();
};

function cogRenderChatList(){
  const data = cogGetData();
  const panel = document.getElementById('aiFutureMessagesPanel');
  const names = Object.keys(data.conversations || {});

  let listHtml;
  if (names.length === 0) {
    listHtml = `<div class="msg-chat-empty">No chats yet.<br>Tap "New chat" to message someone.</div>`;
  } else {
    names.sort((a,b) => {
      const ta = (data.conversations[a].slice(-1)[0] || {}).ts || 0;
      const tb = (data.conversations[b].slice(-1)[0] || {}).ts || 0;
      return tb - ta;
    });
    listHtml = names.map(name => {
      const thread = data.conversations[name] || [];
      const last = thread[thread.length - 1];
      const preview = last ? (last.from === 'me' ? 'You: ' : '') + cogEscape(last.text) : 'No messages yet';
      const safeName = cogEscape(name);
      return `
        <div class="msg-chat-list-item" onclick="cogOpenChat(decodeURIComponent('${encodeURIComponent(name)}'))">
          <div class="msg-chat-avatar">${cogEscape(cogInitials(name))}</div>
          <div class="msg-chat-info">
            <div class="msg-chat-name">${safeName}</div>
            <div class="msg-chat-preview">${preview}</div>
          </div>
        </div>`;
    }).join('');
  }

  panel.innerHTML = `
    <div class="msg-chat-list">
      <div class="msg-chat-list-header">
        <span>Chats — ${cogEscape(data.userName)}</span>
        <button class="msg-new-chat-btn" onclick="cogShowNewChat()">+ New chat</button>
      </div>
      ${listHtml}
    </div>`;
}

function cogRenderConversation(name){

      ${cogEscape(m.text)}
      ${cogRenderAttachments(m.attachments)}
      <span class="msg-bubble-time">${cogEscape(m.from === 'me' ? data.userName : name)} · ${cogEscape(m.time)}</span>
    </div>`).join('');

    <div class="msg-conversation">
      <div class="msg-conv-header">
        <button class="msg-conv-back" onclick="cogActiveChat=null; renderAIFutureMessages();">←</button>
        <div class="msg-chat-avatar">${cogEscape(cogInitials(name))}</div>
        <div class="msg-conv-name">${cogEscape(name)}</div>
      </div>
      <div class="msg-conv-body" id="cogConvBody">
        ${bubbles || '<div class="msg-chat-empty">No messages yet. Say hi 👋</div>'}
      </div>

        <input type="file" class="cog-file-input" id="cogMsgFileInput" multiple accept="*/*" onchange="cogFilesSelected(event,'msg')" />
        <button class="cog-input-icon" type="button" title="Emoji" onclick="cogToggleEmojiPicker()">😊</button>
        <input type="text" id="cogMsgInput" placeholder="Message ${cogEscape(name)}..." autocomplete="off" />
        <button class="cog-input-icon" type="button" id="cogMsgMicBtn" title="Voice message" onclick="cogToggleMic('msg')">🎙️</button>

window.cogSendMessage = function(){
  const inp = document.getElementById('cogMsgInput');
  if (!inp || !cogActiveChat) return;
  const text = inp.value.trim();
  const allPending = cogPendingAttachments.msg;
  // Only files that finished reading are ready; keep still-loading ones staged.
  const ready = allPending.filter(a => !a.loading);
  const stillLoading = allPending.filter(a => a.loading);
  if (!text && !ready.length) return; // nothing ready to send yet

  const data = cogGetData();
  if (!data.conversations[cogActiveChat]) data.conversations[cogActiveChat] = [];
  data.conversations[cogActiveChat].push({
    from: 'me', text: text, time: cogTimeNow(), ts: Date.now(),
    attachments: ready.map(a => ({ name: a.name, mime: a.mime, url: a.url }))
  });
  cogSaveData(data);
  inp.value = '';
  cogPendingAttachments.msg = stillLoading;
  cogRenderConversation(cogActiveChat); // re-render in place — no page refresh needed
};

// Web development files are not allowed as attachments (any other file type is fine)
const COG_BLOCKED_EXT = ['html','htm','css','js','mjs','cjs','jsx','ts','tsx','php','asp','aspx','jsp','vue','svelte'];
const COG_MAX_ATTACH_BYTES = 8 * 1024 * 1024; // 8MB per file, so it can be saved+reopened later

window.cogPendingAttachments = { search: [], msg: [] };

window.cogFilesSelected = function(event, target){
  let files = Array.from(event.target.files || []);
  event.target.value = ''; // allow re-selecting the same file(s) next time
  if (!files.length) return;

  const blocked = files.filter(f => COG_BLOCKED_EXT.includes((f.name.split('.').pop() || '').toLowerCase()));
  if (blocked.length) {
    files = files.filter(f => !blocked.includes(f));
    alert('Web development files (' + blocked.map(f => f.name).join(', ') + ") can't be attached.");
  }

  const tooBig = files.filter(f => f.size > COG_MAX_ATTACH_BYTES);
  if (tooBig.length) {
    files = files.filter(f => !tooBig.includes(f));
    alert('These files are over 8MB and can\'t be attached: ' + tooBig.map(f => f.name).join(', '));
  }
  if (!files.length) return;

  files.forEach(f => {
    // Show a "loading" chip immediately so the user gets instant feedback
    // in the search bar — don't wait for the (possibly slow) file read to finish.
    const pendingEntry = { name: f.name, mime: f.type || 'application/octet-stream', url: null, loading: true };
    cogPendingAttachments[target].push(pendingEntry);
    cogRenderAttachChips(target);

    const reader = new FileReader();
    reader.onload = function(){
      pendingEntry.url = reader.result;
      pendingEntry.loading = false;
      cogRenderAttachChips(target);
    };
    reader.onerror = function(){
      // Reading failed — remove the stuck placeholder instead of leaving a dead chip
      const idx = cogPendingAttachments[target].indexOf(pendingEntry);
      if (idx > -1) cogPendingAttachments[target].splice(idx, 1);
      cogRenderAttachChips(target);
      alert('Could not attach "' + f.name + '". Please try again.');
    };
    reader.readAsDataURL(f);
  });
};

function cogAttachIcon(mime){
  if ((mime || '').startsWith('video/')) return '🎬';
  if ((mime || '').startsWith('audio/')) return '🎵';
  if (mime === 'application/pdf') return '📄';
  return '📎';
}

// Render the removable chips for files staged but not yet sent
window.cogRenderAttachChips = function(target){
  const containerId = target === 'search' ? 'cogSearchAttachChips' : 'cogMsgAttachChips';
  const container = document.getElementById(containerId);
  if (!container) return;
  const items = cogPendingAttachments[target];

  container.classList.toggle('has-items', items.length > 0);
  container.innerHTML = items.map((a, i) => {
    const isImg = !a.loading && a.mime.startsWith('image/');
    const thumb = a.loading
      ? `<span class="cog-attach-chip-icon cog-attach-chip-loading">⏳</span>`
      : (isImg
          ? `<img class="cog-attach-chip-thumb" src="${a.url}" alt="">`
          : `<span class="cog-attach-chip-icon">${cogAttachIcon(a.mime)}</span>`);
    return `
      <div class="cog-attach-chip${a.loading ? ' cog-attach-chip-pending' : ''}" title="${cogEscape(a.name)}">
        ${thumb}
        <span class="cog-attach-chip-name">${cogEscape(a.name)}</span>
        <button type="button" class="cog-attach-chip-remove" onclick="cogRemoveAttachment('${target}',${i})" title="Remove">×</button>
      </div>`;
  }).join('');
};

window.cogRemoveAttachment = function(target, index){
  cogPendingAttachments[target].splice(index, 1);
  cogRenderAttachChips(target);
};

// Render clickable, reopenable attachment links inside a sent chat bubble / message.
// Clicking opens a preview card first (image/video/audio/pdf inline, or a generic file
// card) — the actual download only happens if the user taps "Download" inside that card.
window.cogAttachStore = window.cogAttachStore || {};
let cogAttachIdCounter = 0;

function cogRenderAttachments(attachments){
  if (!attachments || !attachments.length) return '';
  const links = attachments.map(a => {
    const id = 'cogAtt' + (cogAttachIdCounter++);
    cogAttachStore[id] = a;
    const isImg = a.mime.startsWith('image/');
    const thumb = isImg
      ? `<img src="${a.url}" alt="">`
      : `<span class="cog-attach-link-icon">${cogAttachIcon(a.mime)}</span>`;
    return `<a class="cog-attach-link" href="javascript:void(0)" onclick="cogOpenAttachPreview('${id}')" title="Open ${cogEscape(a.name)}">${thumb}<span class="cog-attach-link-name">${cogEscape(a.name)}</span></a>`;
  }).join('');
  return `<div class="cog-msg-attachments">${links}</div>`;
}

// Open the preview modal for a stored attachment (by id, so we never inline
// large data-URLs into onclick attributes).
window.cogOpenAttachPreview = function(id){
  const a = cogAttachStore[id];
  if (!a) return;
  const mime = a.mime || 'application/octet-stream';
  let bodyHtml;
  if (mime.startsWith('image/')) {
    bodyHtml = `<img src="${a.url}" alt="${cogEscape(a.name)}">`;
  } else if (mime.startsWith('video/')) {
    bodyHtml = `<video src="${a.url}" controls></video>`;
  } else if (mime.startsWith('audio/')) {
    bodyHtml = `<audio src="${a.url}" controls></audio>`;
  } else if (mime === 'application/pdf') {
    bodyHtml = `<iframe src="${a.url}"></iframe>`;
  } else {
    bodyHtml = `<div class="cog-preview-generic"><span class="cog-preview-generic-icon">${cogAttachIcon(mime)}</span>${cogEscape(a.name)}<br>No inline preview available for this file type.</div>`;
  }

  document.getElementById('cogPreviewIcon').textContent = cogAttachIcon(mime);
  document.getElementById('cogPreviewName').textContent = a.name;
  document.getElementById('cogPreviewBody').innerHTML = bodyHtml;
  const dl = document.getElementById('cogPreviewDownload');
  dl.href = a.url;
  dl.setAttribute('download', a.name);

  document.getElementById('cogPreviewOverlay').classList.add('open');
};

window.cogCloseAttachPreview = function(){
  document.getElementById('cogPreviewOverlay').classList.remove('open');
  document.getElementById('cogPreviewBody').innerHTML = '';
};

// ==== Mic / voice input (Web Speech API) — works on both search bars ====
let cogRecognition = null;
let cogMicTarget = null;

window.cogToggleMic = function(target){
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btnId = target === 'search' ? 'cogSearchMicBtn' : 'cogMsgMicBtn';
  const btn = document.getElementById(btnId);

  if (!SpeechRec) {
    alert('Voice input is not supported in this browser. Try Chrome or Edge.');
    return;
  }

  // If already listening, stop
  if (cogRecognition && cogMicTarget === target) {
    cogRecognition.stop();
    return;
  }
  // Switch target mid-listen: stop the old one first
  if (cogRecognition) { cogRecognition.stop(); }

  const rec = new SpeechRec();
  cogRecognition = rec;
  cogMicTarget = target;
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 1;

  rec.onstart = function(){ if (btn) btn.classList.add('cog-mic-active'); };
  rec.onerror = function(){ if (btn) btn.classList.remove('cog-mic-active'); };
  rec.onend = function(){
    if (btn) btn.classList.remove('cog-mic-active');
    cogRecognition = null;
    cogMicTarget = null;
  };
  rec.onresult = function(e){
    const transcript = e.results[0][0].transcript;
    const inputId = target === 'search' ? 'aiFutureSearchInput' : 'cogMsgInput';
    const inp = document.getElementById(inputId);
    if (inp) {
      inp.value = inp.value ? `${inp.value} ${transcript}` : transcript;
      inp.focus();
    }
  };

  rec.start();
};

window.cogToggleEmojiPicker = function(){
  const picker = document.getElementById('cogEmojiPicker');
  if (!picker) return;
  const willOpen = !picker.classList.contains('open');
  picker.classList.toggle('open', willOpen);
  if (willOpen) {
    cogRenderEmojiGrid(COG_EMOJI_DATA);
    const search = document.getElementById('cogEmojiSearch');
    if (search) { search.value = ''; search.focus(); }
  }
};

function cogRenderEmojiGrid(list){
  const grid = document.getElementById('cogEmojiGrid');
  if (!grid) return;
  if (!list.length) {
    grid.innerHTML = '<div class="cog-emoji-empty">No emoji found</div>';
    return;
  }
  grid.innerHTML = list.map(([emoji]) =>
    `<button type="button" onclick="cogInsertEmoji('${emoji}')">${emoji}</button>`
  ).join('');
}

window.cogFilterEmoji = function(){
  const search = document.getElementById('cogEmojiSearch');
  const q = (search ? search.value : '').trim().toLowerCase();
  if (!q) { cogRenderEmojiGrid(COG_EMOJI_DATA); return; }
  const filtered = COG_EMOJI_DATA.filter(([emoji, keywords]) => keywords.includes(q));
  cogRenderEmojiGrid(filtered);
};

window.cogInsertEmoji = function(emoji){
  const inp = document.getElementById('cogMsgInput');
  if (inp) {
    const start = inp.selectionStart != null ? inp.selectionStart : inp.value.length;
    const end = inp.selectionEnd != null ? inp.selectionEnd : inp.value.length;
    inp.value = inp.value.slice(0, start) + emoji + inp.value.slice(end);
    inp.focus();
    const pos = start + emoji.length;
    inp.setSelectionRange(pos, pos);
  }
};

// Close the emoji picker when clicking outside of it
document.addEventListener('click', function(e){
  const picker = document.getElementById('cogEmojiPicker');
  if (!picker || !picker.classList.contains('open')) return;
  const bar = picker.closest('.msg-conv-input-bar');
  if (bar && !bar.contains(e.target)) picker.classList.remove('open');
});
